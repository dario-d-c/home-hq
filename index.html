<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2EEE6">
  <title>Home HQ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Home HQ"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/calendar.css">
  <link rel="stylesheet" href="css/views/tasks.css">
  <link rel="stylesheet" href="css/views/shopping.css">
  <link rel="stylesheet" href="css/views/photos.css">
  <link rel="stylesheet" href="css/views/control.css">
  <link rel="stylesheet" href="css/views/agents.css">
  <link rel="stylesheet" href="css/views/ambient.css">
  <link rel="stylesheet" href="css/screensaver.css">
  <link rel="stylesheet" href="./css/views/meals.css">
  <link rel="stylesheet" href="./css/portrait.css">
  <link rel="stylesheet" href="./css/soft.css">
  <link rel="stylesheet" href="./css/editmode.css">
  <link rel="stylesheet" href="./css/phone.css">
  <link rel="stylesheet" href="./css/phone-type.css">
  <link rel="stylesheet" href="./css/seasonal.css">
  <link rel="stylesheet" href="./css/sheets.css">
</head>
<body>
  <div class="stage" id="stage" data-mode="day">
    <nav class="rail" id="rail" aria-label="Sections">
      <button class="rail-item" data-go="home"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
      <button class="rail-item" data-go="calendar"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button class="rail-item" data-go="tasks"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 12l3 3 6-6"/></svg><span>Chores</span></button>
      <button class="rail-item" data-go="meals"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 21V3c-2 1-3.5 3.5-3.5 7s1.5 4 3.5 4"/></svg><span>Meals</span></button>
      <button class="rail-item" data-go="shopping"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8L21 8H6.5"/><circle cx="10" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Shopping</span></button>
      <button class="rail-item" data-go="photos"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Photos</span></button>
      <button class="rail-item" data-go="control"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Home</span></button>
      <button class="rail-item" data-go="agents"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9.5 13v1.5M14.5 13v1.5M2 13v3M22 13v3"/></svg><span>Agents</span></button>
      <button class="rail-show rail-sitter" id="railSitter" aria-label="Babysitter mode"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/><path d="M10 8h.01M14 8h.01"/></svg><span>Sitter</span></button>
      <button class="rail-show" id="railShow" aria-label="Start photo slideshow"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg><span>Slideshow</span></button>
      <div id="railClock" hidden></div>
    </nav>

    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-tasks" data-view="tasks"></section>
      <section class="view" id="view-meals" data-view="meals"></section>
      <section class="view" id="view-shopping" data-view="shopping"></section>
      <section class="view view--bleed" id="view-photos" data-view="photos"></section>
      <section class="view" id="view-control" data-view="control"></section>
      <section class="view" id="view-agents" data-view="agents"></section>
      <div class="banners" id="banners"></div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="takeover" id="takeover" role="alertdialog"></div>
    <div class="ambient" id="ambient"></div>
    <div class="night" id="night"></div>
    <div class="demo" id="demo"></div>
  </div>

  <script>
    // Startup guard (plain ES5 so even very old browsers run it). If the app doesn't start, retry a
    // couple of times (stale page after a deploy / network blip), then show a friendly message
    // instead of a blank screen or an endless reload loop.
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) { errs.push((e && e.message) || 'Script error'); });
      function show(why) {
        if (window.App && window.App.started) return;
        var d = document.createElement('div');
        d.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#F2EEE6;color:#111;font:20px/1.45 -apple-system,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center');
        d.innerHTML = '<div style="max-width:620px"><div style="font-size:56px">🖼️</div><h1 style="font-size:32px;margin:10px 0">The family screen couldn’t start</h1>' +
          '<p>' + why + '</p><p style="color:#7A756B;font-size:15px">Details: ' + (errs.join(' · ') || 'no error reported') + '<br>' + navigator.userAgent + '</p>' +
          '<button onclick="sessionStorage.removeItem(\'hq-retry\');location.reload()" style="font:inherit;font-weight:700;padding:14px 28px;border:0;border-radius:14px;background:#111;color:#fff">Try again</button></div>';
        document.body.appendChild(d);
      }
      window.HQShowStartupError = show;
      setTimeout(function () {
        if (window.App && window.App.started) { sessionStorage.removeItem('hq-retry'); return; }
        var n = +(sessionStorage.getItem('hq-retry') || 0);
        if (n < 2) { try { sessionStorage.setItem('hq-retry', n + 1); } catch (e) {} location.reload(); return; }
        show('Please check the Wi-Fi and tap Try again. If it keeps happening, this browser may be too old — it needs iOS 12 or newer (Safari 12+) or a recent Chrome.');
      }, 10000);
    })();
  </script>
  <script nomodule>
    // Browsers without ES modules (iOS 10.2 and older) can't run the app at all.
    window.addEventListener('load', function () { window.HQShowStartupError('This browser is too old to run the family screen. It needs iOS 12 or newer (Safari 12+), or a recent Chrome.'); });
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
